services:
  - type: web
    name: chess
    runtime: node
    plan: free
    # pieces, music and artwork are not in the repo; `npm run assets` (hooked to
    # prebuild) downloads whatever is missing before the client is built
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
